<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>笔记</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="layout">
  <!-- 左侧：搜索 + 新建 + 树形导航 -->
  <aside class="sidebar">
    <div class="search-box">
      <svg viewBox="0 0 16 16" class="s-ico"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M10.6 10.6L14 14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      <input id="searchInput" placeholder="搜索">
    </div>
    <button class="btn-create" id="btnNew">＋ 新建</button>
    <button class="btn-manage" id="btnManage">分组管理</button>
    <div class="tree" id="tree"></div>
    <div class="side-footer">
      <div class="user"><span class="avatar">U</span><span>用户</span></div>
    </div>
  </aside>

  <!-- 中间：目录大纲 -->
  <section class="outline-pane" id="outlinePane">
    <div class="outline-head">
      <span>目录</span>
      <span class="o-tools">
        <span class="o-tool" id="outlineFollow" title="跟随滚动高亮">◉</span>
        <span class="o-tool" id="outlineTop" title="回到顶部">⇱</span>
      </span>
    </div>
    <div class="outline-list" id="outlineList"></div>
  </section>

  <!-- 右侧：编辑器 -->
  <section class="editor-pane" id="editorPane">
    <div class="toolbar" id="toolbar">
      <div class="tb-wrap">
        <button class="tb-btn" data-menu="insertMenu">＋ 插入</button>
        <div class="dropdown" id="insertMenu" hidden>
          <div class="dd-item" data-ins="image">图片</div>
          <div class="dd-item" data-ins="link">链接</div>
          <div class="dd-item" data-ins="table">表格</div>
          <div class="dd-item" data-ins="hr">分割线</div>
          <div class="dd-item" data-ins="code">代码块</div>
          <div class="dd-item" data-ins="quote">引用</div>
        </div>
      </div>
      <div class="tb-wrap">
        <button class="tb-btn" data-menu="headingMenu">正文 ▾</button>
        <div class="dropdown" id="headingMenu" hidden>
          <div class="dd-item" data-block="h1">标题 1</div>
          <div class="dd-item" data-block="h2">标题 2</div>
          <div class="dd-item" data-block="h3">标题 3</div>
          <div class="dd-item" data-block="p">正文</div>
        </div>
      </div>
      <select id="fontFamily" class="tb-select" title="字体">
        <option value="">默认字体</option>
        <option value="宋体">宋体</option>
        <option value="微软雅黑">微软雅黑</option>
        <option value="楷体">楷体</option>
        <option value="Arial">Arial</option>
      </select>
      <select id="fontSize" class="tb-select" title="字号">
        <option value="">字号</option>
        <option value="12">12</option>
        <option value="14">14</option>
        <option value="16">16</option>
        <option value="18">18</option>
        <option value="22">22</option>
        <option value="26">26</option>
        <option value="32">32</option>
      </select>
      <span class="sep"></span>
      <button class="tb-icon" data-cmd="bold" title="加粗"><b>B</b></button>
      <button class="tb-icon" data-cmd="italic" title="斜体"><i>I</i></button>
      <button class="tb-icon" data-cmd="underline" title="下划线"><u>U</u></button>
      <button class="tb-icon" data-cmd="strikeThrough" title="删除线"><s>S</s></button>
      <label class="tb-icon color" title="文字颜色">A<input type="color" id="textColor" value="#333333"></label>
      <label class="tb-icon color hl" title="高亮">A<input type="color" id="bgColor" value="#ffe58f"></label>
      <span class="sep"></span>
      <button class="tb-icon" data-cmd="justifyLeft" title="左对齐">⇤</button>
      <button class="tb-icon" data-cmd="justifyCenter" title="居中">⇔</button>
      <button class="tb-icon" data-cmd="justifyRight" title="右对齐">⇥</button>
      <span class="sep"></span>
      <button class="tb-icon" data-cmd="insertUnorderedList" title="无序列表">≔</button>
      <button class="tb-icon" data-cmd="insertOrderedList" title="有序列表">1.</button>
      <button class="tb-icon" data-cmd="outdent" title="减少缩进">⇠</button>
      <button class="tb-icon" data-cmd="indent" title="增加缩进">⇢</button>
      <span class="sep"></span>
      <button class="tb-icon" id="btnImage" title="插入图片">🖼</button>
      <button class="tb-icon" id="btnLink" title="插入链接">🔗</button>
      <button class="tb-icon" data-cmd="undo" title="撤销">↩</button>
      <button class="tb-icon" data-cmd="redo" title="重做">↪</button>
      <span class="flex"></span>
      <span class="save-status" id="saveStatus">已保存</span>
      <button class="tb-icon danger" id="btnTrashNote" title="删除到回收站">🗑</button>
    </div>
    <input type="file" id="imageInput" accept="image/*" hidden multiple>
    <div class="editor-scroll" id="editorScroll">
      <div class="doc">
        <input id="noteTitle" class="note-title" placeholder="无标题">
        <div id="editor" class="editor" contenteditable="true" data-placeholder="记录点什么..."></div>
      </div>
    </div>
  </section>
</div>

<!-- 新建分组弹窗 -->
<div class="modal-mask" id="groupModal" hidden>
  <div class="modal">
    <h3 id="groupModalTitle">新建分组</h3>
    <input id="groupNameInput" placeholder="分组名称" maxlength="20">
    <div class="modal-btns">
      <button id="groupCancel">取消</button>
      <button id="groupOk" class="primary">确定</button>
    </div>
  </div>
</div>

<!-- 移动笔记到分组的菜单 -->
<div class="dropdown move-menu" id="moveMenu" hidden></div>

<div id="toast" class="toast" hidden></div>
<script src="/static/js/app.js"></script>
</body>
</html>
